name: Daily AI Digest

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get last report date
        id: last-date
        run: |
          last_file=$(git log --oneline --format='' --name-only -1 | grep '\.md$' | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          if [ -n "$last_file" ]; then
            last_date=$(basename "$last_file" .md | sed 's/_AI.*//')
            echo "last_date=$last_date" >> $GITHUB_OUTPUT
          fi

      - name: Generate report
        env:
          LAST_DATE: ${{ steps.last-date.outputs.last_date }}
        run: node .github/workflows/generate.mjs

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes, skipping"
          else
            DATE=$(date +%Y-%m-%d)
            git -c commit.gpgsign=false commit -m "docs: AI前沿速递 $DATE"
            git push
          fi

      - name: Show preview
        run: |
          FILE=$(ls -t *.md 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            echo "=== 今日报告预览 ==="
            head -25 "$FILE"
          fi